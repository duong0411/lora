name: Mobile Release (APK + IPA)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (vd 1.0.8) — bỏ trống nếu push tag"
        required: false
        default: ""
      ios_only:
        description: "Chỉ build IPA (bỏ APK)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    name: Build APK
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.ios_only) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landslide_monitor/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/landslide_monitor-android.apk
          ls -lah dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: landslide_monitor/mobile/dist/landslide_monitor-android.apk
          if-no-files-found: error

  # Thử macos-14 trước; nếu queue lâu có thể đổi macos-15 / macos-latest
  build-ios:
    name: Build IPA (unsigned)
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        working-directory: landslide_monitor/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign
          test -d build/ios/iphoneos/Runner.app

      - name: Pack unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (
            cd dist
            zip -qry landslide_monitor-ios-unsigned.ipa Payload
          )
          ls -lah dist
          unzip -l dist/landslide_monitor-ios-unsigned.ipa | head -n 20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: landslide_monitor/mobile/dist/landslide_monitor-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download IPA
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-assets

      - name: Resolve tag
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.8-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p release-assets
          ls -lah release-assets || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Landslide Monitor ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## Mobile builds
            - **Android APK**: `landslide_monitor-android.apk` — cài trực tiếp
            - **iOS IPA**: `landslide_monitor-ios-unsigned.ipa` — chưa ký Apple (cần cert để cài máy thật)

            ## Cảnh báo khi tắt app (kiểu Shopee)
            1. Mở app → cấp quyền **Thông báo**
            2. Cho phép **bỏ tối ưu pin** / không hạn chế nền
            3. Giữ thanh `SATLO đang giám sát` trên khay thông báo
            4. Vuốt tắt app vẫn nhận heads-up khi gateway báo `SAT_LO` / `WET_RISK`

            MQTT: `wss://mqtt.duynguyen.io.vn/mqtt` — Chip mặc định `SATLO_GW01`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
