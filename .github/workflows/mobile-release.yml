name: Mobile Release (APK + IPA)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (vd 1.0.8) — bỏ trống nếu push tag"
        required: false
        default: ""
      ios_only:
        description: "Chỉ build IPA (bỏ APK)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    name: Build APK
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.ios_only) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landslide_monitor/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/landslide_monitor-android.apk
          ls -lah dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: landslide_monitor/mobile/dist/landslide_monitor-android.apk
          if-no-files-found: error

  # Thử macos-14 trước; nếu queue lâu có thể đổi macos-15 / macos-latest
  build-ios:
    name: Build IPA (unsigned)
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        working-directory: landslide_monitor/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # Flutter mới: --no-codesign vẫn fail Development Team / SPM Run Script.
      # Cách ổn định: tắt SPM, patch signing off, flutter build, fallback xcodebuild.
      # Lỗi Sideloadly trước: IPA ~520B chỉ có thư mục rỗng (thiếu Info.plist) —
      # vì nhận Runner.app stub. Phải validate Info.plist + binary trước khi pack.
      - name: Build iOS (unsigned)
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager || true
          flutter precache --ios

          # Tắt codesign trong xcconfig (Flutter + Xcode đều đọc)
          {
            echo '#include "Generated.xcconfig"'
            echo 'CODE_SIGNING_ALLOWED=NO'
            echo 'CODE_SIGNING_REQUIRED=NO'
            echo 'CODE_SIGN_IDENTITY=-'
            echo 'DEVELOPMENT_TEAM='
          } > ios/Flutter/Release.xcconfig
          {
            echo '#include "Generated.xcconfig"'
            echo 'CODE_SIGNING_ALLOWED=NO'
            echo 'CODE_SIGNING_REQUIRED=NO'
            echo 'CODE_SIGN_IDENTITY=-'
            echo 'DEVELOPMENT_TEAM='
          } > ios/Flutter/Debug.xcconfig

          # Patch pbxproj: không bắt Team/Automatic signing
          python3 <<'PY'
          from pathlib import Path
          p = Path('ios/Runner.xcodeproj/project.pbxproj')
          t = p.read_text()
          t = t.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
          needle = 'PRODUCT_BUNDLE_IDENTIFIER = com.duong0411.landslide.landslideMonitor;'
          inject = (
              'CODE_SIGNING_ALLOWED = NO;\n'
              '\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n'
              '\t\t\t\tCODE_SIGN_IDENTITY = "-";\n'
              '\t\t\t\tDEVELOPMENT_TEAM = "";\n'
              '\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = com.duong0411.landslide.landslideMonitor;'
          )
          if 'CODE_SIGNING_ALLOWED = NO;' not in t:
              t = t.replace(needle, inject)
          p.write_text(t)
          print('patched project.pbxproj')
          PY

          is_valid_app() {
            local app="$1"
            [ -d "$app" ] && [ -f "$app/Info.plist" ] && {
              [ -f "$app/Runner" ] || [ -f "$app/Runner.app" ] || \
              find "$app" -maxdepth 1 -type f -perm +111 | grep -q .
            }
          }

          find_valid_app() {
            local cand
            for cand in \
              build/ios/iphoneos/Runner.app \
              build/ios/Release-iphoneos/Runner.app \
              build/ios_derived/Build/Products/Release-iphoneos/Runner.app
            do
              if is_valid_app "$cand"; then
                echo "$cand"
                return 0
              fi
            done
            # Tìm sâu hơn (tránh nhận stub chỉ có Frameworks/)
            while IFS= read -r cand; do
              if is_valid_app "$cand"; then
                echo "$cand"
                return 0
              fi
            done < <(find build -type d -name 'Runner.app' 2>/dev/null | head -n 20)
            return 1
          }

          set +e
          flutter build ios --release --no-codesign -v 2>&1 | tee /tmp/flutter_ios_build.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "flutter build exit=$RC"

          APP=""
          if APP="$(find_valid_app)"; then
            echo "Found valid Runner.app after flutter: $APP"
          else
            echo "Runner.app incomplete/missing — fallback xcodebuild"
            # Xóa stub rỗng để tránh nhầm lần sau
            rm -rf build/ios/iphoneos/Runner.app build/ios/Release-iphoneos/Runner.app || true
            cd ios
            pod install
            xcodebuild \
              -workspace Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath ../build/ios_derived \
              COMPILER_INDEX_STORE_ENABLE=NO \
              VERBOSE_SCRIPT_LOGGING=YES \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              build
            cd ..
            APP="$(find_valid_app)" || {
              echo "::error::Không tìm thấy Runner.app hợp lệ (thiếu Info.plist / binary)"
              find build -name 'Runner.app' -type d 2>/dev/null | head -n 30 || true
              exit 1
            }
          fi

          echo "APP=$APP"
          ls -lah "$APP"
          test -f "$APP/Info.plist"
          plutil -lint "$APP/Info.plist"
          # Persist path for pack step
          mkdir -p dist
          echo "$APP" > dist/app_path.txt

      - name: Pack unsigned IPA
        run: |
          set -euo pipefail
          APP="$(cat dist/app_path.txt)"
          test -d "$APP"
          test -f "$APP/Info.plist"

          rm -rf dist/Payload dist/ipa_stage
          mkdir -p dist/ipa_stage/Payload
          # ditto giữ cấu trúc .app tốt hơn cp -R (symlink Frameworks)
          ditto "$APP" dist/ipa_stage/Payload/Runner.app
          test -f dist/ipa_stage/Payload/Runner.app/Info.plist

          (
            cd dist/ipa_stage
            rm -f ../landslide_monitor-ios-unsigned.ipa
            # -y: store symlinks; IPA phải có Payload/Runner.app/Info.plist
            zip -qry -y ../landslide_monitor-ios-unsigned.ipa Payload
          )

          IPA="dist/landslide_monitor-ios-unsigned.ipa"
          ls -lah "$IPA"
          SIZE=$(stat -f%z "$IPA")
          echo "IPA size=$SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::IPA quá nhỏ ($SIZE bytes) — bundle chưa build đủ"
            unzip -l "$IPA" | head -n 50
            exit 1
          fi
          unzip -l "$IPA" | grep -F "Payload/Runner.app/Info.plist" || {
            echo "::error::Thiếu Payload/Runner.app/Info.plist trong IPA"
            unzip -l "$IPA" | head -n 50
            exit 1
          }
          unzip -l "$IPA" | head -n 30

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: landslide_monitor/mobile/dist/landslide_monitor-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download IPA
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-assets

      - name: Resolve tag
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.8-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p release-assets
          ls -lah release-assets || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Landslide Monitor ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## Mobile builds
            - **Android APK**: `landslide_monitor-android.apk` — cài trực tiếp
            - **iOS IPA**: `landslide_monitor-ios-unsigned.ipa` — chưa ký Apple (cần cert để cài máy thật)

            ## Cảnh báo khi tắt app (kiểu Shopee)
            1. Mở app → cấp quyền **Thông báo**
            2. Cho phép **bỏ tối ưu pin** / không hạn chế nền
            3. Giữ thanh `SATLO đang giám sát` trên khay thông báo
            4. Vuốt tắt app vẫn nhận heads-up khi gateway báo `SAT_LO` / `WET_RISK`

            MQTT: `wss://mqtt.duynguyen.io.vn/mqtt` — Chip mặc định `SATLO_GW01`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
